global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: kafka-broker
    static_configs:
      - targets: [broker:9404]

  - job_name: schema-registry
    static_configs:
      - targets: [schema-registry:9405]

  - job_name: mill-cuts-transactional-producer
    static_configs:
      - targets: [mill-cuts-transactional-producer:9406]

  - job_name: mill-cuts-at-least-once-producer
    static_configs:
      - targets: [mill-cuts-at-least-once-producer:9406]

  - job_name: mill-cuts-transactional-consumer
    static_configs:
      - targets: [mill-cuts-transactional-consumer:9406]

  - job_name: mill-cuts-idempotent-consumer
    static_configs:
      - targets: [mill-cuts-idempotent-consumer:9406]

  - job_name: mill-cuts-group-lag
    static_configs:
      - targets: [mill-cuts-lag-exporter:9407]

  - job_name: mill-tool-events-producer
    static_configs:
      - targets: [mill-tool-events-producer:9406]

  - job_name: mill-tool-events-consumer
    static_configs:
      - targets: [mill-tool-events-consumer:9406]

  - job_name: mill-tool-events-outcomes
    static_configs:
      - targets: [mill-tool-events-outcomes:9408]
