x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - streaming

x-broker-ready: &broker-ready
  broker:
    condition: service_healthy

x-registry-ready: &registry-ready
  schema-registry:
    condition: service_healthy

x-postgres-ready: &postgres-ready
  postgres:
    condition: service_healthy

x-cut-app-ready: &cut-app-ready
  broker:
    condition: service_healthy
  schema-registry:
    condition: service_healthy
  postgres:
    condition: service_healthy
  topic-bootstrap:
    condition: service_completed_successfully
  cut-topic-bootstrap:
    condition: service_completed_successfully
  schema-bootstrap:
    condition: service_completed_successfully
  cuts-db-bootstrap:
    condition: service_completed_successfully
  cuts-avro-schema-bootstrap:
    condition: service_completed_successfully
  cuts-app-build:
    condition: service_completed_successfully

x-event-app-ready: &event-app-ready
  broker:
    condition: service_healthy
  schema-registry:
    condition: service_healthy
  postgres:
    condition: service_healthy
  event-topic-bootstrap:
    condition: service_completed_successfully
  event-schema-bootstrap:
    condition: service_completed_successfully
  event-db-bootstrap:
    condition: service_completed_successfully
  cuts-app-build:
    condition: service_completed_successfully

services:
  broker:
    <<: *service-defaults
    image: local/gotogether-kafka:8.1.6-1.6.0
    build:
      context: .
      dockerfile: Dockerfile.jmx
      args:
        CONFLUENT_IMAGE: confluentinc/cp-kafka:8.1.6
    hostname: broker
    mem_limit: 1g
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512M -Xmx512M
      KAFKA_OPTS: -javaagent:/usr/share/java/jmx_prometheus_javaagent-1.6.0.jar=9404:/etc/jmx/kafka.yml
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./monitoring/kafka-jmx.yml:/etc/jmx/kafka.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_OPTS= kafka-topics --bootstrap-server broker:29092 --list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  schema-registry:
    <<: *service-defaults
    image: local/gotogether-schema-registry:8.1.6-1.6.0
    build:
      context: .
      dockerfile: Dockerfile.jmx
      args:
        CONFLUENT_IMAGE: confluentinc/cp-schema-registry:8.1.6
    hostname: schema-registry
    mem_limit: 512m
    depends_on: *broker-ready
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://broker:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms256M -Xmx256M
      SCHEMA_REGISTRY_JMX_OPTS: -javaagent:/usr/share/java/jmx_prometheus_javaagent-1.6.0.jar=9405:/etc/jmx/schema-registry.yml
    volumes:
      - ./monitoring/schema-registry-jmx.yml:/etc/jmx/schema-registry.yml:ro
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  topic-bootstrap:
    image: confluentinc/cp-kafka:8.1.6
    entrypoint: ["kafka-topics"]
    command:
      - --bootstrap-server
      - broker:29092
      - --create
      - --if-not-exists
      - --topic
      - cnc-demo-records
      - --partitions
      - "1"
      - --replication-factor
      - "1"
      - --config
      - retention.ms=86400000
    depends_on: *broker-ready
    restart: "no"
    networks:
      - streaming

  cut-topic-bootstrap:
    image: confluentinc/cp-kafka:8.1.6
    entrypoint: ["bash", "-ec"]
    command:
      - |
        for topic in mill-cuts-transactional-source mill-cuts-replay-source mill-cuts-committed; do
          kafka-topics --bootstrap-server broker:29092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1 --config retention.ms=86400000
        done
    depends_on: *broker-ready
    restart: "no"
    networks:
      - streaming

  schema-bootstrap:
    image: python:3.13.7-slim
    command: ["python", "/scripts/register_schema.py"]
    depends_on:
      <<: [*broker-ready, *registry-ready]
      topic-bootstrap:
        condition: service_completed_successfully
    environment:
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SCHEMA_PATH: /schema/cnc-demo-records.schema.json
    volumes:
      - ./scripts/register_schema.py:/scripts/register_schema.py:ro
      - ./schemas/cnc-demo-records.schema.json:/schema/cnc-demo-records.schema.json:ro
    restart: "no"
    networks:
      - streaming

  cuts-avro-schema-bootstrap:
    image: python:3.13.7-slim
    command: ["python", "/scripts/register_cut_schemas.py"]
    depends_on:
      <<: [*broker-ready, *registry-ready]
      cut-topic-bootstrap:
        condition: service_completed_successfully
    environment:
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SCHEMA_PATH: /schema/cut-record.avsc
    volumes:
      - ./scripts/register_cut_schemas.py:/scripts/register_cut_schemas.py:ro
      - ./src/main/resources/avro/cut-record.avsc:/schema/cut-record.avsc:ro
    restart: "no"
    networks:
      - streaming

  event-topic-bootstrap:
    image: confluentinc/cp-kafka:8.1.6
    entrypoint: ["bash", "-ec"]
    command:
      - |
        for topic in mill-tool-events-source mill-tool-events-dlq; do
          kafka-topics --bootstrap-server broker:29092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1 --config retention.ms=86400000
        done
    depends_on: *broker-ready
    restart: "no"
    networks:
      - streaming

  event-schema-bootstrap:
    image: python:3.13.7-slim
    command: ["python", "/scripts/register_event_schemas.py"]
    depends_on:
      <<: [*broker-ready, *registry-ready]
      event-topic-bootstrap:
        condition: service_completed_successfully
    environment:
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SCHEMA_PATH: /schema/event-record.avsc
    volumes:
      - ./scripts/register_event_schemas.py:/scripts/register_event_schemas.py:ro
      - ./src/main/resources/avro/event-record.avsc:/schema/event-record.avsc:ro
    restart: "no"
    networks:
      - streaming

  event-db-bootstrap:
    image: postgres:17.6-alpine
    entrypoint: ["sh", "-ec"]
    command: ["psql --host postgres --username gotogether --dbname gotogether --set ON_ERROR_STOP=1 --file /sql/init_events.sql"]
    depends_on: *postgres-ready
    volumes:
      - ./scripts/init_events.sql:/sql/init_events.sql:ro
    restart: "no"
    networks:
      - streaming

  cuts-app-build:
    image: local/mill-cuts-pipeline:1.0.0
    build:
      context: .
      dockerfile: Dockerfile.app
    entrypoint: ["sh", "-c"]
    command: ["true"]
    restart: "no"
    networks:
      - streaming

  mill-cuts-transactional-producer:
    <<: *service-defaults
    image: local/mill-cuts-pipeline:1.0.0
    mem_limit: 512m
    entrypoint: ["java", "-javaagent:/usr/share/java/jmx_prometheus_javaagent-1.6.0.jar=9406:/etc/jmx/cut-app.yml", "-jar", "/app/app.jar"]
    command: ["producer", "transactional"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_CLIENT_ID: mill-cuts-transactional-producer
      CUT_TOPIC: mill-cuts-transactional-source
      CUT_RECORD_COUNT: "30"
      CUT_INTERVAL_MS: "2000"
    volumes:
      - ./monitoring/cut-app-jmx.yml:/etc/jmx/cut-app.yml:ro
    depends_on: *cut-app-ready

  mill-cuts-at-least-once-producer:
    <<: *service-defaults
    image: local/mill-cuts-pipeline:1.0.0
    mem_limit: 512m
    entrypoint: ["java", "-javaagent:/usr/share/java/jmx_prometheus_javaagent-1.6.0.jar=9406:/etc/jmx/cut-app.yml", "-jar", "/app/app.jar"]
    command: ["producer", "at-least-once"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_CLIENT_ID: mill-cuts-at-least-once-producer
      CUT_TOPIC: mill-cuts-replay-source
      CUT_RECORD_COUNT: "30"
      CUT_INTERVAL_MS: "2000"
    volumes:
      - ./monitoring/cut-app-jmx.yml:/etc/jmx/cut-app.yml:ro
    depends_on: *cut-app-ready

  mill-cuts-transactional-consumer:
    <<: *service-defaults
    image: local/mill-cuts-pipeline:1.0.0
    mem_limit: 512m
    entrypoint: ["java", "-javaagent:/usr/share/java/jmx_prometheus_javaagent-1.6.0.jar=9406:/etc/jmx/cut-app.yml", "-jar", "/app/app.jar"]
    command: ["consumer", "transactional"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_CLIENT_ID: mill-cuts-transactional-consumer
      KAFKA_TRANSACTIONAL_ID: mill-cuts-transactional-consumer
      CONSUMER_GROUP_ID: mill-cuts-transactional-consumer
      CUT_TOPIC: mill-cuts-transactional-source
      PROCESSED_TOPIC: mill-cuts-committed
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/gotogether
      POSTGRES_USER: gotogether
    volumes:
      - ./monitoring/cut-app-jmx.yml:/etc/jmx/cut-app.yml:ro
    depends_on: *cut-app-ready

  mill-cuts-idempotent-consumer:
    <<: *service-defaults
    image: local/mill-cuts-pipeline:1.0.0
    mem_limit: 512m
    entrypoint: ["java", "-javaagent:/usr/share/java/jmx_prometheus_javaagent-1.6.0.jar=9406:/etc/jmx/cut-app.yml", "-jar", "/app/app.jar"]
    command: ["consumer", "idempotent"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_CLIENT_ID: mill-cuts-idempotent-consumer
      CONSUMER_GROUP_ID: mill-cuts-idempotent-consumer
      CUT_TOPIC: mill-cuts-replay-source
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/gotogether
      POSTGRES_USER: gotogether
    volumes:
      - ./monitoring/cut-app-jmx.yml:/etc/jmx/cut-app.yml:ro
    depends_on: *cut-app-ready

  mill-tool-events-producer:
    <<: *service-defaults
    image: local/mill-cuts-pipeline:1.0.0
    mem_limit: 512m
    entrypoint: ["java", "-javaagent:/usr/share/java/jmx_prometheus_javaagent-1.6.0.jar=9406:/etc/jmx/cut-app.yml", "-jar", "/app/app.jar"]
    command: ["event-producer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_CLIENT_ID: mill-tool-events-producer
      EVENT_TOPIC: mill-tool-events-source
      EVENT_RECORD_COUNT: "30"
      EVENT_INTERVAL_MS: "2000"
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/gotogether
      POSTGRES_USER: gotogether
    volumes:
      - ./monitoring/cut-app-jmx.yml:/etc/jmx/cut-app.yml:ro
    depends_on: *event-app-ready

  mill-tool-events-consumer:
    <<: *service-defaults
    image: local/mill-cuts-pipeline:1.0.0
    mem_limit: 512m
    entrypoint: ["java", "-javaagent:/usr/share/java/jmx_prometheus_javaagent-1.6.0.jar=9406:/etc/jmx/cut-app.yml", "-jar", "/app/app.jar"]
    command: ["event-consumer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_CLIENT_ID: mill-tool-events-consumer
      CONSUMER_GROUP_ID: mill-tool-events-consumer
      EVENT_TOPIC: mill-tool-events-source
      EVENT_DLQ_TOPIC: mill-tool-events-dlq
      EVENT_FAILURE_PROBABILITY: "0.2"
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/gotogether
      POSTGRES_USER: gotogether
    volumes:
      - ./monitoring/cut-app-jmx.yml:/etc/jmx/cut-app.yml:ro
    depends_on: *event-app-ready

  mill-tool-events-outcomes:
    <<: *service-defaults
    image: local/mill-cuts-pipeline:1.0.0
    mem_limit: 512m
    entrypoint: ["java", "-jar", "/app/app.jar"]
    command: ["event-outcome-exporter"]
    environment:
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/gotogether
      POSTGRES_USER: gotogether
      EVENT_METRICS_PORT: "9408"
    depends_on:
      postgres:
        condition: service_healthy
      event-db-bootstrap:
        condition: service_completed_successfully
      cuts-app-build:
        condition: service_completed_successfully

  mill-cuts-lag-exporter:
    <<: *service-defaults
    image: local/mill-cuts-pipeline:1.0.0
    mem_limit: 512m
    entrypoint: ["java", "-jar", "/app/app.jar"]
    command: ["lag-exporter"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      LAG_EXPORTER_PORT: "9407"
    depends_on:
      broker:
        condition: service_healthy
      cuts-app-build:
        condition: service_completed_successfully
      event-topic-bootstrap:
        condition: service_completed_successfully

  postgres:
    <<: *service-defaults
    image: postgres:17.6-alpine
    mem_limit: 512m
    ports:
      - target: 5432
        published: "${POSTGRES_PORT:-5432}"
        host_ip: 127.0.0.1
    environment:
      POSTGRES_DB: gotogether
      POSTGRES_USER: gotogether
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotogether -d gotogether"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  cuts-db-bootstrap:
    image: postgres:17.6-alpine
    entrypoint: ["sh", "-ec"]
    command: ["psql --host postgres --username gotogether --dbname gotogether --set ON_ERROR_STOP=1 --file /sql/init_cuts.sql"]
    depends_on: *postgres-ready
    volumes:
      - ./scripts/init_cuts.sql:/sql/init_cuts.sql:ro
    restart: "no"
    networks:
      - streaming

  akhq:
    <<: *service-defaults
    image: tchiotludo/akhq:0.28.0
    mem_limit: 512m
    depends_on:
      <<: [*broker-ready, *registry-ready]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JAVA_OPTS: -Xms128M -Xmx256M
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            local:
              properties:
                bootstrap.servers: broker:29092
              schema-registry:
                url: http://schema-registry:8081

  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v3.14.0
    mem_limit: 512m
    depends_on:
      <<: [*broker-ready, *registry-ready]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    <<: *service-defaults
    image: grafana/grafana:13.0.9
    mem_limit: 512m
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

  streamlens:
    <<: *service-defaults
    image: local/streamlens:8b1cdd1
    build:
      context: https://github.com/muralibasani/streamlens.git#8b1cdd19ac120d9b0f81e80e7510ea05c13e4e64
      dockerfile: container/Dockerfile
    mem_limit: 512m
    depends_on:
      <<: [*broker-ready, *registry-ready]
      prometheus:
        condition: service_started
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      CLUSTERS_JSON: /config/clusters.json
    volumes:
      - ./monitoring/streamlens/clusters.json:/config/clusters.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  kafka_data:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  streaming:
    driver: bridge
